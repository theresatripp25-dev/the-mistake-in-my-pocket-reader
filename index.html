<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Mistake in My Pocket</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg,#f8f3e8, #eee4d2);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 18px;
      background: #b9a9c0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      color: #fffaf2;
      letter-spacing: 0.5px;
      font-family: "Trebuchet MS", Arial, san-serif;
    }

    #reader {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
      padding: 20px;
    }

    #page {
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      
      max-height: 70vh;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    button {
      padding: 12px 22px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4a4036;
      color: white;
      min-height: 48px;
      touch-action: manipulation;
      
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #pageNumber {
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <header>
    <h1>The Mistake in My Pocket</h1>
  </header>

  <main id="reader">
    <img id="page" alt="Book page">
  </main>

  <div class="controls">
    <button id="previous">← Previous</button>

    <span id="pageNumber">Page 1 of 52</span>

    <button id="next">Next →</button>
  </div>

  <script>
    const totalPages = 52;
    let currentPage = 1;

    const page = document.getElementById("page");
    const pageNumber = document.getElementById("pageNumber");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");

    function showPage() {
      page.src = "page-" +
        String(currentPage).padStart(2, "0") +
        ".png";

      pageNumber.textContent =
        "Page " + currentPage + " of " + totalPages;

      previous.disabled = currentPage === 1;
      next.disabled = currentPage === totalPages;
    }

    previous.addEventListener("click", function () {
      if (currentPage > 1) {
        currentPage--;
        showPage();
      }
    });

    next.addEventListener("click", function () {
      if (currentPage < totalPages) {
        currentPage++;
        showPage();
      }
    });

    showPage();
    document.addEventListener("keydown", function(event){
      if (event.key === "ArrowRight" && currentPage < totalPages){
        currentPage++;
        showPage();
      }
      if (event.key === "ArrowLeft" && currentPage > 1) {
        currentPage--;
        showPage();
      }
    });
    let touchStartX = null;
    page.addEventListener("touchstart", function(event) {
      touchStartX = event.changedTouches[0].clientX;
    });
    page.addEventListener("touchend", function(event) {
      const touchEndX = event.changedTouches[0].clientX;
      const swipeDistance = touchEndX - touchStartX;
      if (swipeDistance <= -50 && currentPage < totalPages) {
        currentPage++;
        showPage();
      }
      else if (swipeDistance >= 50 && currentPage > 1) {
        currentPage--;
        showPage();
      }
      touchStartX = null;
    });
        
  </script>

</body>
</html>
